# Enable mouse support:
# - click to focus panes
# - drag pane borders to resize
# - scroll through tmux history
set -g mouse on

# Number of lines kept in the scrollback buffer per pane.
# Useful for long-running agent sessions, logs and test output.
set -g history-limit 100000

# Start window numbering at 1 instead of 0.
# Makes shortcuts like Prefix+1 select the first window.
set -g base-index 1

# Start pane numbering at 1 instead of 0.
# Mostly a cosmetic preference.
setw -g pane-base-index 1

# Automatically renumber windows when one is closed.
# Example: if windows 1,2,3 exist and 2 is closed,
# window 3 becomes window 2.
set -g renumber-windows on

# Prevent tmux from automatically renaming windows based on
# the currently running command.
# Allows manually assigned names to remain stable.
setw -g automatic-rename off

# Enable support for extended key sequences in xterm-compatible terminals.
# Improves handling of modified keys (Ctrl, Alt, Shift, etc.).
set -g xterm-keys on

# Enable the newer extended keyboard protocol.
# Helps tmux distinguish more key combinations in modern terminals
# such as Ghostty, WezTerm and recent versions of iTerm2.
set -s extended-keys on

# Set pane borders
set -g pane-border-style 'fg=#444444'
set -g pane-active-border-style 'fg=#00afff'